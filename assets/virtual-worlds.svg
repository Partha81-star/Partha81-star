<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Parth Bhad — building intelligent virtual worlds</title>
  <desc id="desc">Animated cyberpunk scene with a rotating wireframe planet, orbiting data nodes, and a terminal introduction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#050816"/><stop offset="0.5" stop-color="#101342"/><stop offset="1" stop-color="#170C2C"/></linearGradient>
    <linearGradient id="neon" x1="120" y1="0" x2="1080" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#00F0FF"/><stop offset="0.5" stop-color="#7C5CFF"/><stop offset="1" stop-color="#FF4FD8"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse" patternTransform="skewY(-18)"><path d="M42 0H0V42" stroke="#6F7BFF" stroke-opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <ellipse cx="680" cy="180" rx="320" ry="160" fill="#633CFF" fill-opacity=".15" filter="url(#soft)"/>
  <path d="M0 290C230 235 380 345 610 282S1000 240 1200 285V360H0V290Z" fill="url(#grid)"/>
  <g opacity=".7" fill="#D9E7FF"><circle cx="82" cy="58" r="1.5"/><circle cx="182" cy="124" r="1"/><circle cx="326" cy="46" r="1.4"/><circle cx="1064" cy="74" r="1.2"/><circle cx="1130" cy="166" r="1.7"/><circle cx="946" cy="42" r="1"/><circle cx="760" cy="28" r="1.4"/></g>
  <g transform="translate(770 178)" filter="url(#glow)">
    <ellipse rx="182" ry="67" transform="rotate(-18)" stroke="url(#neon)" stroke-width="2" stroke-dasharray="8 10"><animateTransform attributeName="transform" type="rotate" from="-18" to="342" dur="18s" repeatCount="indefinite"/></ellipse>
    <ellipse rx="144" ry="52" transform="rotate(55)" stroke="#00F0FF" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="3 9"><animateTransform attributeName="transform" type="rotate" from="55" to="415" dur="13s" repeatCount="indefinite"/></ellipse>
    <circle r="88" fill="#101B4B" stroke="url(#neon)" stroke-width="2"/>
    <ellipse rx="88" ry="28" stroke="#00F0FF" stroke-opacity=".7"/><ellipse rx="88" ry="50" transform="rotate(62)" stroke="#FF4FD8" stroke-opacity=".55"/>
    <path d="M-86-3C-38-31 24-35 86-5M-80 31C-28 4 30 0 80 26M-48-73C-18-25-20 31-42 74M16-86C-10-30-8 30 20 86" stroke="#8B9CFF" stroke-opacity=".75" stroke-width="1.4"/>
    <circle cx="0" cy="-88" r="5" fill="#00F0FF"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></circle><circle cx="90" cy="-7" r="5" fill="#FF4FD8"><animate attributeName="opacity" values="1;.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(68 72)">
    <text x="0" y="0" fill="#8FA8FF" font-family="monospace" font-size="13" letter-spacing="3">PARTH_BHAD / VIRTUAL_WORLDS</text>
    <text x="0" y="58" fill="white" font-family="Arial, sans-serif" font-size="40" font-weight="700">I build ideas that move.</text>
    <text x="0" y="96" fill="#C9D4FF" font-family="Arial, sans-serif" font-size="18">AI • Computer Vision • Cybersecurity • IoT</text>
    <rect x="0" y="137" width="500" height="86" rx="12" fill="#050816" fill-opacity=".85" stroke="#6E7BFF" stroke-opacity=".5"/>
    <text x="22" y="166" fill="#63F5C8" font-family="monospace" font-size="14">$ whoami</text><text x="22" y="191" fill="#F4F7FF" font-family="monospace" font-size="14">engineer@the-edge:~$ _</text><rect x="210" y="180" width="8" height="16" fill="#00F0FF"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
  <g stroke="#00F0FF" stroke-width="1" stroke-opacity=".55"><path d="M530 100L622 75L686 113"/><path d="M522 240L604 276L672 230"/><path d="M1002 109L1078 134L1100 213"/></g>
  <g fill="#00F0FF" filter="url(#glow)"><circle cx="530" cy="100" r="4"/><circle cx="622" cy="75" r="4"/><circle cx="686" cy="113" r="4"/><circle cx="522" cy="240" r="4"/><circle cx="604" cy="276" r="4"/><circle cx="672" cy="230" r="4"/></g>
</svg>
